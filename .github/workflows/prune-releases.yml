# Remove old GitHub Releases, keeping one.
#
# Run from Actions → Prune releases → Run workflow. It deletes release entries
# and, optionally, the tags behind them. Both are irreversible from the UI, so
# the workflow is built to make an accident hard rather than to be quick:
#
#   * It does nothing unless `confirm` is typed exactly as `DELETE`.
#   * `dry_run` defaults to true, so the first run always reports and stops.
#   * The release named in `keep` is never touched, and neither is anything
#     newer than it.
#
# The binary attached to a deleted release goes with it. Anyone holding a link
# to one will get a 404, which is the point, but it is worth knowing before
# rather than after.
name: Prune releases

on:
  workflow_dispatch:
    inputs:
      keep:
        description: "Tag to keep, e.g. v0.28.1. This one and anything newer survive."
        required: true
      delete_tags:
        description: "Also delete the git tags, not just the release entries"
        type: boolean
        default: false
      dry_run:
        description: "Report what would be deleted and stop"
        type: boolean
        default: true
      confirm:
        description: 'Type DELETE to confirm. Ignored when dry_run is on.'
        required: false
        default: ""

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse an unconfirmed deletion
        if: ${{ inputs.dry_run == false && inputs.confirm != 'DELETE' }}
        run: |
          echo "::error::Set dry_run, or type DELETE in confirm. Neither was done."
          exit 1

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prune
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: ${{ inputs.keep }}
          DRY: ${{ inputs.dry_run }}
          DEL_TAGS: ${{ inputs.delete_tags }}
        shell: bash
        run: |
          set -euo pipefail

          # Addressed by release ID, not by tag.
          #
          # `gh release delete` takes a tag name and resolves it. A release
          # whose tag has been deleted has no name left to resolve, so every
          # such release refuses to delete -- which is most of them here, since
          # deleting the tags first is exactly what orphaned them. The REST API
          # lists releases with their own IDs and deletes by ID, which works
          # whether or not a tag survives.
          repo="${GITHUB_REPOSITORY}"

          # id<TAB>tag, one release per line, drafts included.
          mapfile -t rows < <(
            gh api "repos/$repo/releases" --paginate --jq '.[] | [.id, .tag_name] | @tsv'
          )
          echo "Found ${#rows[@]} release(s); keeping $KEEP and anything newer."

          keep_seen=0
          for row in "${rows[@]}"; do
            [ "$(cut -f2 <<<"$row")" = "$KEEP" ] && keep_seen=1
          done
          if [ "$keep_seen" -eq 0 ]; then
            echo "::error::No release tagged $KEEP. Nothing done."
            exit 1
          fi

          # `sort -V` orders versions properly, so 0.9.0 sorts below 0.10.0 --
          # which a lexical sort gets backwards, and which is exactly the
          # mistake that would delete the wrong thing.
          doomed=()
          for row in "${rows[@]}"; do
            id=$(cut -f1 <<<"$row")
            tag=$(cut -f2 <<<"$row")
            [ "$tag" = "$KEEP" ] && continue
            older=$( { echo "${tag#v}"; echo "${KEEP#v}"; } | sort -V | head -1 )
            if [ "$older" = "${tag#v}" ]; then
              doomed+=("$id|$tag")
            fi
          done

          if [ ${#doomed[@]} -eq 0 ]; then
            echo "Nothing older than $KEEP. Done."
            exit 0
          fi

          echo "Would delete:"
          for row in "${doomed[@]}"; do
            echo "  ${row#*|}  (id ${row%%|*})"
          done

          if [ "$DRY" = "true" ]; then
            echo "Dry run: nothing was deleted. Re-run with dry_run off and confirm=DELETE."
            exit 0
          fi

          # One failure must not abort the rest, and the reason must be visible:
          # an earlier version swallowed stderr and reported only that something
          # had gone wrong, which cost a round trip to discover what.
          failed=0
          for row in "${doomed[@]}"; do
            id="${row%%|*}"
            tag="${row#*|}"
            if err=$(gh api -X DELETE "repos/$repo/releases/$id" 2>&1); then
              echo "deleted release $tag (id $id)"
            else
              echo "::warning::could not delete $tag (id $id): $err"
              failed=$((failed + 1))
              continue
            fi
            if [ "$DEL_TAGS" = "true" ]; then
              # A 404 here is the normal case: the tag is usually already gone,
              # which is why the release was unaddressable by name at all.
              if gh api -X DELETE "repos/$repo/git/refs/tags/$tag" >/dev/null 2>&1; then
                echo "  ...and its tag"
              fi
            fi
          done

          echo "Kept: $KEEP"
          if [ "$failed" -gt 0 ]; then
            echo "::error::$failed release(s) could not be deleted; each warning above says why."
            exit 1
          fi
