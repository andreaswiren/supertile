[package]
name = "supertile"
version = "0.31.4"
edition = "2021"
rust-version = "1.85"
description = "Fast, tray-resident fullscreen autotiling window manager and command palette for Windows 11"
authors = ["Andreas Wiren <andreas.wiren@gmail.com>"]
license = "MIT"
repository = "https://github.com/andreaswiren/supertile"
readme = "README.md"
keywords = ["windows", "tiling", "window-manager", "launcher", "productivity"]
categories = ["gui", "os::windows-apis"]
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Accessibility", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Com", "Win32_System_Registry", "Win32_System_ProcessStatus", "Win32_Security", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_Globalization", "Win32_Graphics_Dwm", "Win32_System_Com_StructuredStorage", "Win32_UI_Shell_Common", "Win32_System_SystemServices", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Performance", "Win32_UI_Input_Ime", "Win32_System_SystemInformation", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_WindowsProgramming", "Win32_Networking_WinHttp"] }

[build-dependencies]
winresource = "0.1.31"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Dedicated profile for measuring/shipping the smallest resident footprint.
[profile.dist]
inherits = "release"
opt-level = "s"
