# Publish a binary for every version tag.
#
# The CI workflow proves a commit is sound; this one turns a tag into something
# a person can download and run. It deliberately rebuilds from the tag rather
# than reusing a CI artefact, so what ships is built from exactly the source the
# tag names and nothing else.
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  # Re-runnable by hand, so a tag whose first attempt failed can be published
  # without inventing a new version number to carry the retry.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, e.g. v0.16.1"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      # A release that fails its own tests is not a release. This duplicates
      # the CI workflow on purpose: a tag can be pushed to a commit CI never
      # ran on, and finding that out after publishing is too late.
      - name: Test
        run: cargo test --all-targets

      - name: Check the version agrees with the tag
        run: python scripts/version.py --check

      - name: Build
        run: cargo build --release --target x86_64-pc-windows-msvc

      # Shipped beside the binary because the CRA expects an SBOM to accompany
      # the product, not merely to exist in a repository.
      # Advisory, not a gate. The SBOM committed to the repository is what
      # ships either way; this only reports whether regenerating it here
      # produces the same document. A difference in the toolchain's own
      # metadata must not be able to block a release that is otherwise sound.
      - name: Verify the SBOM matches the source
        continue-on-error: true
        run: |
          cargo install cargo-cyclonedx --locked
          python scripts/make-sbom.py --check

      - name: Stage the release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/supertile.exe dist/
          Copy-Item docs/compliance/sbom.cdx.json dist/supertile.cdx.json
          Copy-Item README.md, CHANGELOG.md, LICENSE dist/ -ErrorAction SilentlyContinue
          # A checksum is the only way a downloader can tell our binary from
          # someone else's, since these builds are not code-signed.
          $h = Get-FileHash dist/supertile.exe -Algorithm SHA256
          "$($h.Hash.ToLower())  supertile.exe" |
            Set-Content dist/supertile.exe.sha256 -Encoding ascii
          Get-Content dist/supertile.exe.sha256

      # An MSI for people who would rather their software arrived the ordinary
      # way: in Apps & features, with an uninstaller, upgrading in place. The
      # loose .exe stays -- it is still the smaller, no-commitment option -- so
      # this adds a choice rather than replacing one.
      - name: Build the installer
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2
          # Windows Installer compares three-part versions only, and the tag is
          # already checked against Cargo.toml by the step above.
          $v = '${{ github.event.inputs.tag || github.ref_name }}' -replace '^v',''
          wix build -arch x64 `
            -d Version=$v `
            -d ExePath=$PWD/dist/supertile.exe `
            -d SbomPath=$PWD/dist/supertile.cdx.json `
            -d IconPath=$PWD/assets/icons/supertile.ico `
            -ext WixToolset.Util.wixext `
            -o dist/supertile.msi packaging/supertile.wxs
          $h = Get-FileHash dist/supertile.msi -Algorithm SHA256
          "$($h.Hash.ToLower())  supertile.msi" |
            Set-Content dist/supertile.msi.sha256 -Encoding ascii
          Get-Content dist/supertile.msi.sha256

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            dist/supertile.exe
            dist/supertile.exe.sha256
            dist/supertile.msi
            dist/supertile.msi.sha256
            dist/supertile.cdx.json
          body: |
            Two ways to install, both the same build.

            * **`supertile.msi`** — installs to `C:\Program Files\supertile`,
              adds a Start-menu entry and an uninstaller, and upgrades a
              previous version in place. Needs administrator rights *once*, to
              write to Program Files. SuperTile itself then runs unelevated.
            * **`supertile.exe`** — the bare binary. Put it anywhere and run it;
              no installer, no dependencies. It lives in the system tray.

            Neither one starts with Windows until you switch that on in
            Settings, and neither writes anything outside
            `%LOCALAPPDATA%\SuperTile` unless you do.

            **These builds are not code-signed**, so SmartScreen will warn on
            first run. Verify a download against its `.sha256` before trusting
            it:

            ```powershell
            Get-FileHash supertile.exe -Algorithm SHA256
            Get-FileHash supertile.msi -Algorithm SHA256
            ```

            `supertile.cdx.json` is the CycloneDX software bill of materials for
            this exact build, as required under the EU Cyber Resilience Act. The
            same document is readable in the app under **About**, and the MSI
            installs a copy beside the binary.

            See [CHANGELOG.md](https://github.com/andreaswiren/supertile/blob/main/CHANGELOG.md)
            for what changed in this version.
          generate_release_notes: true
          fail_on_unmatched_files: true
